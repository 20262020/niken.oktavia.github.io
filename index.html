<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Niken Oktavia | Business Analyst Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f7f9fc;
      color: #1f2937;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
    }

    header {
      background: #ffffff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
      gap: 20px;
    }

    .logo h2 {
      color: #0b2a4a;
      font-size: 24px;
      letter-spacing: 1px;
    }

    .logo span {
      color: #d9a441;
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 22px;
      align-items: center;
    }

    nav a {
      font-weight: bold;
      color: #1f2937;
      transition: 0.3s;
    }

    nav a:hover {
      color: #d9a441;
    }

    .btn-cv {
      background: #0b2a4a;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      display: inline-block;
    }

    .btn-cv:hover {
      background: #123b63;
      color: white;
    }

    .hero {
      background: linear-gradient(120deg, #08233f, #0b2a4a, #123b63);
      color: white;
      padding: 80px 0;
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: center;
    }

    .hero small {
      color: #f5b942;
      letter-spacing: 3px;
      font-weight: bold;
    }

    .hero h1 {
      font-size: 54px;
      margin: 18px 0 10px;
      line-height: 1.1;
    }

    .hero h1 span {
      color: #f5b942;
    }

    .hero h3 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .hero p {
      color: #e5e7eb;
      max-width: 680px;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .btn-primary,
    .btn-secondary {
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: bold;
      display: inline-block;
    }

    .btn-primary {
      background: #f5b942;
      color: #0b2a4a;
    }

    .btn-primary:hover {
      background: #d9a441;
    }

    .btn-secondary {
      border: 1px solid white;
      color: white;
    }

    .btn-secondary:hover {
      background: white;
      color: #0b2a4a;
    }

    .hero-image {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 35px;
      text-align: center;
    }

    .profile-placeholder {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      margin: auto;
      background: linear-gradient(135deg, white, #f5b942);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b2a4a;
      font-size: 64px;
      font-weight: bold;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .quick-skills {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 30px;
    }

    .quick-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .quick-card h4 {
      color: #f5b942;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .quick-card p {
      font-size: 13px;
      margin: 0;
    }

    section {
      padding: 70px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title h2 {
      color: #0b2a4a;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .section-title p {
      color: #6b7280;
    }

    .about-grid,
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .card,
    .experience-card,
    .skill-box {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
    }

    .card h3,
    .experience-card h3,
    .skill-box h3 {
      color: #0b2a4a;
      margin-bottom: 15px;
    }

    .check-list {
      list-style: none;
    }

    .check-list li {
      margin-bottom: 12px;
      padding-left: 28px;
      position: relative;
    }

    .check-list li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #d9a441;
      font-weight: bold;
    }

    .experience-card {
      border-left: 6px solid #d9a441;
    }

    .experience-card span {
      color: #6b7280;
      display: block;
      margin-bottom: 18px;
    }

    /* Modern Projects Section */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
    }

    .project-card {
      background: #ffffff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.10);
      border: 1px solid #e5e7eb;
      transition: 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.16);
    }

    .project-media {
      height: 220px;
      background: linear-gradient(135deg, #0b2a4a, #123b63, #f5b942);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .project-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-media .media-icon {
      font-size: 56px;
      z-index: 2;
    }

    .project-media .media-label {
      position: absolute;
      bottom: 16px;
      left: 18px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: bold;
    }

    .project-content {
      padding: 26px;
    }

    .project-badge {
      display: inline-block;
      background: #eef4fb;
      color: #0b2a4a;
      padding: 7px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .project-content h3 {
      color: #0b2a4a;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .project-content p {
      color: #4b5563;
      font-size: 15px;
      margin-bottom: 18px;
    }

    .project-points {
      list-style: none;
      margin-bottom: 20px;
    }

    .project-points li {
      position: relative;
      padding-left: 24px;
      margin-bottom: 9px;
      color: #374151;
      font-size: 14px;
    }

    .project-points li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #d9a441;
      font-size: 22px;
      line-height: 16px;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .project-tags span {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      color: #0b2a4a;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      background: #eef4fb;
      color: #0b2a4a;
      padding: 8px 12px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: bold;
    }

    .contact {
      background: #0b2a4a;
      color: white;
      text-align: center;
    }

    .contact h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .contact p {
      color: #e5e7eb;
      margin-bottom: 24px;
    }

    .contact-info {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .contact-info div {
      background: rgba(255, 255, 255, 0.08);
      padding: 14px
