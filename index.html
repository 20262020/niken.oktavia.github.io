  <title>Niken Oktavia | Business Analyst Portfolio</title>

  <style>
    :root {
      --bg: #f8fbff;
      --white: #ffffff;
      --text: #243047;
      --muted: #64748b;

      --soft-blue: #dbeafe;
      --soft-blue-light: #eff6ff;

      --soft-pink: #f9dce8;
      --soft-pink-light: #fff5f8;

      --accent-blue: #6f9fdf;
      --accent-pink: #cf659d;
      --dark-blue: #1e3a5f;

      --border: #e5e7eb;
      --shadow: 0 12px 32px rgba(30, 58, 95, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(90%, 1200px);
      margin-inline: auto;
    }

    section {
      padding: 72px 0;
    }

    /* Header */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 2px 16px rgba(30, 58, 95, 0.07);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
    }

    .logo {
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .logo h2 {
      color: var(--dark-blue);
      font-size: 23px;
      letter-spacing: 1px;
    }

    .logo span {
      display: block;
      color: var(--accent-pink);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav ul {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      list-style: none;
    }

    nav button,
    nav a {
      display: inline-block;
      padding: 9px 11px;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
