    :root {
      --bg: #f8fbff;
      --white: #ffffff;
      --text: #243047;
      --muted: #64748b;

      --soft-blue: #dbeafe;
      --soft-blue-light: #eff6ff;

      --soft-pink: #f9dce8;

      --accent-blue: #6f9fdf;

      --dark-blue: #1e3a5f;

      --border: #e5e7eb;
      --shadow: 0 12px 32px rgba(30, 58, 95, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(90%, 1200px);
      margin: auto;
    }

    section {

    /* Header */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 2px 16px rgba(30, 58, 95, 0.07);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
    }

    .logo {
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .logo h2 {
      color: var(--dark-blue);
      font-size: 23px;
      letter-spacing: 1px;
    }

    .logo span {
      display: block;
      color: var(--accent-pink);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav ul {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      list-style: none;
    }

    nav button {
      padding: 9px 11px;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.22s ease;
    }

    nav button:hover,
    nav button:focus-visible {
      background: linear-gradient(
        135deg,
        var(--soft-blue),
        var(--soft-pink)
      );
      color: var(--dark-blue);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(30, 58, 95, 0.12);
    }

    nav button:active {
      transform: translateY(1px) scale(0.97);
    }

    .btn-cv {
      background: linear-gradient(
        135deg,
        var(--soft-blue),
        var(--soft-pink)
      );
      border: 1px solid var(--soft-blue);
    }

    .hero {
      padding: 86px 0;
      background:

          circle at 15% 20%,
          rgba(207, 101, 157, 0.2),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 25%,
          rgba(111, 159, 223, 0.22),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #ffffff 0%,
          var(--soft-blue-light) 48%,
          var(--soft-pink-light) 100%
        );
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 42px;
    }

    .hero small {

      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
    }

      margin: 18px 0 12px;
      color: var(--dark-blue);
      font-size: clamp(44px, 5vw, 58px);
      line-height: 1.08;
